name: Deploy via ftp
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Copia assets/js/head.js para o <head> das páginas
      run: python3 scripts/inline-head.py

    - name: Versiona scripts (?v=<hash>)
      run: python3 scripts/versionar-assets.py
    
    - name: FTP Deploy Locaweb
      uses: locaweb/ftp-deploy@1.0.0
      with:
        host: ${{ secrets.HOST }}
        user: ${{ secrets.USER }}
        password: ${{ secrets.PASS }}
        localDir: "."
